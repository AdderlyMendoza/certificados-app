[project]
name = "certificados-app-backend"
version = "0.1.0"
description = "Plataforma de generación masiva de certificados"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "SIM", "C4"]
ignore = ["ANN101", "ANN102", "ANN401", "B008"]  # B008: Depends() en defaults es idiomático en FastAPI

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["ANN", "E501"]
"tests/*" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
